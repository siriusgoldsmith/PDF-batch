# Builds and tests the unsigned Windows executable. This does not sign code.
name: Windows build (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PDFIUM_RELEASE: chromium/8152
jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Download PDFium
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:PDFIUM_RELEASE --repo bblanchon/pdfium-binaries -p pdfium-win-x64.tgz -D vendor/pdfium
          tar -xzf vendor/pdfium/pdfium-win-x64.tgz -C vendor/pdfium
          Get-FileHash vendor/pdfium/bin/pdfium.dll -Algorithm SHA256 | Tee-Object pdfium-sha256.txt
      - name: Tests
        run: cargo test --workspace --locked 2>&1 | Tee-Object tests.log
        shell: pwsh
      - name: Build release
        run: cargo build --release --locked -p pdf-batch-app
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/pdf-batch.exe, README.md, LEEME.txt, COPYING, THIRD_PARTY.txt, PRIVACY.md dist/
          Copy-Item licenses dist/licenses -Recurse
          Get-FileHash dist/pdf-batch.exe -Algorithm SHA256 | Format-List | Out-File dist/SHA256.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-batch-unsigned
          path: |
            dist/
            tests.log
            pdfium-sha256.txt
