# Template only: NOT active from docs/. Move to .github/workflows/ only
# after the owner authorizes GitHub workflow access. This does not sign code.
name: Windows build (unsigned)
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
      - run: python -m unittest test_core test_physical test_queue_cleanup test_cleanup_legacy -v
  windows-build:
    runs-on: windows-latest
    needs: core-linux
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          architecture: x64
          cache: pip
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }
      - name: Prepare installed Microsoft runtime
        run: |
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item "$env:WINDIR\System32\msvcp140*.dll" runtime\ -ErrorAction Stop
          Copy-Item "$env:WINDIR\System32\vcruntime140*.dll" runtime\ -ErrorAction Stop
      - name: Test source
        run: |
          python -m unittest discover -v 2>&1 | Tee-Object tests-source.log
          if ($LASTEXITCODE -ne 0) { throw 'Source tests failed' }
      - name: Build real Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean PDFLote.spec
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
      - name: Run compiled EXE diagnostic without printing
        run: |
          $process = Start-Process -FilePath .\dist\PDFLote.exe -ArgumentList '--diagnostico','qa-frozen.json' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen diagnostic failed' }
          if (-not (Test-Path qa-frozen.json)) { throw 'Missing diagnostic result' }
          $report = Get-Content qa-frozen.json -Raw | ConvertFrom-Json
          if (-not $report.frozen -or -not $report.recovery_preview_rendered -or -not $report.custom_boundary_and_no_repeat) { throw 'Diagnostic assertions failed' }
      - name: Test with frozen archive check enabled
        run: |
          $env:PDFLOTE_CHECK_FROZEN='1'
          python -m unittest discover -v 2>&1 | Tee-Object tests-frozen.log
          if ($LASTEXITCODE -ne 0) { throw 'Frozen regression tests failed' }
          python qa_gui.py
          if ($LASTEXITCODE -ne 0) { throw 'GUI diagnostic failed' }
          Get-FileHash dist/PDFLote.exe -Algorithm SHA256 | Format-List | Out-File exe-sha256.txt
      - name: Preserve unsigned artifact and verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFLote-unsigned-${{ github.sha }}
          if-no-files-found: error
          path: |
            dist/PDFLote.exe
            exe-sha256.txt
            qa-frozen.json
            qa-gui.json
            tests-source.log
            tests-frozen.log
      - name: Preserve failure logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PDFLote-build-failure-${{ github.sha }}
          if-no-files-found: ignore
          path: |
            *.log
            qa-*.json
            build/PDFLote/warn-PDFLote.txt
