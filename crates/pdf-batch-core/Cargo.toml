[package]
name = "pdf-batch-core"
version = "2.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Durable, ordered PDF dispatch journal for PDF-batch"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
