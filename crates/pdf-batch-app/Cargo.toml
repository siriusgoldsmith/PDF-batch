[package]
name = "pdf-batch-app"
version = "2.0.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PDF-batch: impresión de PDFs por lotes para Windows"

[[bin]]
name = "pdf-batch"
path = "src/main.rs"

[dependencies]
pdf-batch-core = { path = "../pdf-batch-core" }
pdf-batch-print = { path = "../pdf-batch-print" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui_extras = { version = "0.29", default-features = false }
rfd = "0.15"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Globalization"] }

[build-dependencies]
winresource = "0.1"
