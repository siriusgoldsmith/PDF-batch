[package]
name = "pdf-batch-print"
version = "2.0.0-alpha.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "PDF rasterisation (PDFium) and Windows GDI printing for PDF-batch"

[dependencies]

pdf-batch-core = { path = "../pdf-batch-core" }
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
thiserror = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps", "Win32_Security",
] }

[dev-dependencies]
tempfile = "3"

